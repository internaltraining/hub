<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Nhựa Nhám Đen của thân máy -->
    <linearGradient id="bodyDark" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Phối màu Ốp Cao su Cam -->
    <linearGradient id="rubberOrange" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#FFB340"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Phối màu Màn hình LCD xanh -->
    <linearGradient id="lcdScreen" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#A9C2A0"/>
      <stop offset="100%" stop-color="#8DA785"/>
    </linearGradient>

    <!-- Bóng râm Drop Shadow để nổi bật máy -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Dấu chữ thập tâm (Crosshair) mờ lót nền -->
  <g opacity="0.3">
    <line x1="200" y1="100" x2="200" y2="300" stroke="#8E8E93" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="200" x2="300" y2="200" stroke="#8E8E93" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="200" cy="200" r="130" fill="none" stroke="#8E8E93" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- ================= TOÀN BỘ MÁY (VUÔNG VỨC & ĐƠN GIẢN) ================= -->
  <g filter="url(#shadow)">
    
    <!-- 1. ỐP CAO SU CAM (RUBBER HOLSTER) - Chữ nhật bo tròn -->
    <rect x="120" y="40" width="160" height="320" rx="16" fill="url(#rubberOrange)"/>
    
    <!-- 2. THÂN MÁY NHỰA ĐEN - Nhỏ hơn viền cao su một chút -->
    <rect x="130" y="50" width="140" height="300" rx="10" fill="url(#bodyDark)" stroke="#48484A" stroke-width="1.5"/>

    <!-- ================= MÀN HÌNH LCD (TOP) ================= -->
    <rect x="145" y="70" width="110" height="46" rx="4" fill="#111"/>
    <rect x="148" y="73" width="104" height="40" rx="2" fill="url(#lcdScreen)"/>
    <!-- Bóng viền màn hình -->
    <rect x="148" y="73" width="104" height="4" fill="#000" opacity="0.15"/>
    
    <!-- Dữ liệu hiển thị gọn gàng, không bị chồng chữ -->
    <text x="156" y="88" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2C3E26">AC</text>
    <text x="200" y="106" font-family="-apple-system, sans-serif" font-size="30" font-weight="800" fill="#1C2E16" text-anchor="middle" letter-spacing="1">115.2</text>
    <text x="242" y="106" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#1C2E16">V</text>

    <!-- ================= NÚT BẤM CHỨC NĂNG (GIỮA) ================= -->
    <g transform="translate(0, 134)">
      <!-- Nút 1: HOLD (Cam) -->
      <circle cx="160" cy="0" r="6" fill="#FF9500"/>
      <text x="160" y="14" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#8E8E93" text-anchor="middle">HOLD</text>

      <!-- Nút 2: MAX (Xám) -->
      <circle cx="200" cy="0" r="6" fill="#636366"/>
      <text x="200" y="14" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#8E8E93" text-anchor="middle">MAX</text>

      <!-- Nút 3: Hz (Xanh) -->
      <circle cx="240" cy="0" r="6" fill="#0A84FF"/>
      <text x="240" y="14" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#8E8E93" text-anchor="middle">Hz</text>
    </g>

    <!-- ================= NÚM VẶN DIAL (TRUNG TÂM) ================= -->
    <g transform="translate(200, 215)">
      <!-- Vòng phân độ (Các mức đo) sắp xếp xa núm vặn ra để không bị đè -->
      <!-- OFF (Trái) -->
      <line x1="-50" y1="-25" x2="-58" y2="-29" stroke="#FF3B30" stroke-width="2"/>
      <text x="-62" y="-32" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FF3B30" text-anchor="end">OFF</text>

      <!-- V AC (Trên cùng) -->
      <line x1="0" y1="-55" x2="0" y2="-62" stroke="#FFF" stroke-width="2"/>
      <text x="0" y="-68" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">V~</text>

      <!-- Ohm / Điện trở (Phải) -->
      <line x1="50" y1="-25" x2="58" y2="-29" stroke="#FFF" stroke-width="2"/>
      <text x="62" y="-32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="start">Ω</text>

      <!-- Ampe (Dưới) -->
      <line x1="0" y1="55" x2="0" y2="62" stroke="#FFF" stroke-width="2"/>
      <text x="0" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">A</text>

      <!-- Khối núm vặn chính -->
      <circle cx="0" cy="0" r="42" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>
      <circle cx="0" cy="0" r="32" fill="#2C2C2E"/>
      
      <!-- Kim chỉ thị của núm vặn (Đang trỏ thẳng lên V AC) -->
      <polygon points="-4,-6 4,-6 0,-34" fill="#FFFFFF"/>
      <rect x="-2" y="-6" width="4" height="25" fill="#FFFFFF"/>
    </g>

    <!-- ================= 3 LỖ CẮM DÂY ĐO (BOTTOM) ================= -->
    <g transform="translate(0, 316)">
      <!-- Lỗ trái: 10A (Đỏ) -->
      <circle cx="160" cy="0" r="10" fill="#111" stroke="#FF3B30" stroke-width="2"/>
      <circle cx="160" cy="0" r="5" fill="#000"/>
      <text x="160" y="-15" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#FF3B30" text-anchor="middle">10A</text>

      <!-- Lỗ giữa: COM (Xám) -->
      <circle cx="200" cy="0" r="10" fill="#111" stroke="#8E8E93" stroke-width="2"/>
      <circle cx="200" cy="0" r="5" fill="#000"/>
      <text x="200" y="-15" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#8E8E93" text-anchor="middle">COM</text>

      <!-- Lỗ phải: V/Ohm (Đỏ) -->
      <circle cx="240" cy="0" r="10" fill="#111" stroke="#FF3B30" stroke-width="2"/>
      <circle cx="240" cy="0" r="5" fill="#000"/>
      <text x="240" y="-15" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#FF3B30" text-anchor="middle">V/Ω</text>
    </g>

  </g>
</svg>
