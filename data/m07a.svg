<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Kim loại Titanium cho thân cờ lê -->
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="75%" stop-color="#D1D1D6"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>

    <!-- Phối màu tối cho Rãnh khắc trên tay cầm -->
    <linearGradient id="grooveDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#48484A"/>
    </linearGradient>
    
    <!-- Phối màu Đai ốc (Hex Nut) -->
    <linearGradient id="nutMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1D1D6"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Hiệu ứng Đổ bóng 3D Siêu Mượt -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- MẶT NẠ (MASK) CẮT KHỐI CỜ LÊ -->
    <mask id="wrenchShape">
      <rect x="0" y="0" width="400" height="400" fill="#000"/>
      <!-- Khối liền (Màu trắng) -->
      <rect x="100" y="186" width="200" height="28" rx="8" fill="#fff"/>
      <circle cx="100" cy="200" r="34" fill="#fff"/>
      <circle cx="300" cy="200" r="28" fill="#fff"/>
      
      <!-- Khoét lỗ Cờ lê Vòng (Ring end) bên phải -->
      <circle cx="300" cy="200" r="16" fill="#000"/>
      <!-- Tạo ngàm 12 cạnh liti bên trong vòng -->
      <circle cx="300" cy="200" r="17.5" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="2 4"/>
      
      <!-- Khoét miệng Cờ lê (Open end) bên trái -->
      <!-- Xoay hếch lên 15 độ giống đồ thật -->
      <g transform="rotate(15 100 200)">
        <rect x="40" y="184" width="65" height="32" rx="2" fill="#000"/>
        <!-- Bo tròn góc trong cùng của miệng cờ lê -->
        <circle cx="95" cy="200" r="16" fill="#000"/>
      </g>
    </mask>
  </defs>

  <!-- BACKGROUND: Vòng tròn HUD kỹ thuật mờ ảo -->
  <g opacity="0.6">
    <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="4 8"/>
  </g>

  <!-- TOÀN BỘ KHỐI VẬT THỂ (Xoay chéo -40 độ & Đổ bóng 3D) -->
  <g transform="rotate(-40 200 200)" filter="url(#dropShadow)">
    
    <!-- Áp dụng mặt nạ cắt lên Khối màu Titanium -->
    <rect x="50" y="150" width="300" height="100" fill="url(#titanium)" mask="url(#wrenchShape)"/>
    
    <!-- Điểm nhấn vát cạnh sáng bóng (Highlight Edge) -->
    <rect x="100" y="186" width="200" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Rãnh cầm (Groove) chìm vào trong -->
    <rect x="140" y="192" width="120" height="16" rx="8" fill="url(#grooveDark)"/>
    <!-- Bóng đen phía trên rãnh tạo độ lún -->
    <rect x="140" y="192" width="120" height="2" fill="#000000" opacity="0.4" rx="1"/>
    <!-- Vạch sáng phía dưới rãnh -->
    <rect x="140" y="206" width="120" height="2" fill="#FFFFFF" opacity="0.2" rx="1"/>
    
    <!-- Ký tự dập chìm trên rãnh kim loại -->
    <text x="200" y="205" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" opacity="0.3" text-anchor="middle" letter-spacing="1">AEROSPACE 7A</text>
    <text x="200" y="204" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1C1C1E" text-anchor="middle" letter-spacing="1">AEROSPACE 7A</text>

    <!-- ĐAI ỐC LỤC GIÁC (HEX NUT) Nằm lọt thỏm trong miệng cờ lê -->
    <g transform="rotate(15 100 200)">
      <!-- Thân đai ốc lục giác -->
      <polygon points="88,200 79,215.6 61,215.6 52,200 61,184.4 79,184.4" fill="url(#nutMetal)" stroke="#3A3A3C" stroke-width="1.5"/>
      <!-- Lỗ ren bên trong -->
      <circle cx="70" cy="200" r="9" fill="#1C1C1E"/>
      <circle cx="70" cy="200" r="9" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" transform="translate(0, 1)"/>
    </g>
    
  </g>
</svg>
