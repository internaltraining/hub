<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Màu vỏ ngoài Titanium -->
    <linearGradient id="titanium" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Màu lá cánh quạt (Thép xám bóng) -->
    <linearGradient id="bladeGrad" x1="0" y1="90" x2="0" y2="220">
      <stop offset="0%" stop-color="#D1D1D6"/>
      <stop offset="100%" stop-color="#3A3A3C"/>
    </linearGradient>

    <!-- Vành đai Kevlar bên trong (Màu vàng kim loại) -->
    <linearGradient id="kevlar" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#D4C07B"/>
      <stop offset="100%" stop-color="#8B7B3E"/>
    </linearGradient>

    <!-- Màu chóp nón trung tâm (Spinner) -->
    <radialGradient id="spinner" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Ánh sáng xanh hắt từ lõi động cơ ra -->
    <radialGradient id="backGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Định nghĩa 1 lá cánh quạt với độ cong khí động học -->
    <path id="fan" d="M196 220 C 160 160, 170 100, 205 90 C 220 120, 210 180, 204 220 Z" 
          fill="url(#bladeGrad)" stroke="#1C1C1E" stroke-width="1"/>
          
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ánh sáng Xanh Dương (Ice Blue) mờ ảo tỏa ra từ lõi -->
  <circle cx="200" cy="220" r="110" fill="url(#backGlow)" opacity="0.5" filter="url(#glow)"/>

  <!-- Lớp vành trong cùng (Inner Ring / Kevlar) -->
  <circle cx="200" cy="220" r="126" fill="#1C1C1E" stroke="url(#kevlar)" stroke-width="4"/>

  <!-- 24 LÁ CÁNH QUẠT (Fan Blades) XOAY TRÒN ĐỀU KHUNG -->
  <g>
    <use href="#fan" transform="rotate(0 200 220)"/>
    <use href="#fan" transform="rotate(15 200 220)"/>
    <use href="#fan" transform="rotate(30 200 220)"/>
    <use href="#fan" transform="rotate(45 200 220)"/>
    <use href="#fan" transform="rotate(60 200 220)"/>
    <use href="#fan" transform="rotate(75 200 220)"/>
    <use href="#fan" transform="rotate(90 200 220)"/>
    <use href="#fan" transform="rotate(105 200 220)"/>
    <use href="#fan" transform="rotate(120 200 220)"/>
    <use href="#fan" transform="rotate(135 200 220)"/>
    <use href="#fan" transform="rotate(150 200 220)"/>
    <use href="#fan" transform="rotate(165 200 220)"/>
    <use href="#fan" transform="rotate(180 200 220)"/>
    <use href="#fan" transform="rotate(195 200 220)"/>
    <use href="#fan" transform="rotate(210 200 220)"/>
    <use href="#fan" transform="rotate(225 200 220)"/>
    <use href="#fan" transform="rotate(240 200 220)"/>
    <use href="#fan" transform="rotate(255 200 220)"/>
    <use href="#fan" transform="rotate(270 200 220)"/>
    <use href="#fan" transform="rotate(285 200 220)"/>
    <use href="#fan" transform="rotate(300 200 220)"/>
    <use href="#fan" transform="rotate(315 200 220)"/>
    <use href="#fan" transform="rotate(330 200 220)"/>
    <use href="#fan" transform="rotate(345 200 220)"/>
  </g>

  <!-- CHÓP NÓN TRUNG TÂM (Spinner) -->
  <circle cx="200" cy="220" r="38" fill="url(#spinner)"/>
  <circle cx="200" cy="220" r="38" fill="none" stroke="#3A3A3C" stroke-width="1.5"/>
  
  <!-- Đường gân xoắn màu trắng đuổi chim (Spinner Swirl) -->
  <path d="M 200 220 Q 225 195, 212 186" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- LỚP VỎ ĐỘNG CƠ NGOÀI CÙNG (Outer Nacelle Lip) -->
  <circle cx="200" cy="220" r="132" fill="none" stroke="url(#titanium)" stroke-width="16"/>
  
  <!-- Bóng râm đổ xuống cánh quạt tạo độ sâu -->
  <circle cx="200" cy="220" r="124" fill="none" stroke="#000000" stroke-width="3" opacity="0.6"/>
  <!-- Vạch viền sáng bóng ngoài cùng -->
  <circle cx="200" cy="220" r="140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- CÁC ĐINH TÁN LẮP RÁP (Rivets) TRÊN VỎ -->
  <g fill="#48484A">
    <circle cx="200" cy="84" r="2"/><circle cx="200" cy="356" r="2"/>
    <circle cx="64" cy="220" r="2"/><circle cx="336" cy="220" r="2"/>
    <circle cx="103.5" cy="123.5" r="2"/><circle cx="296.5" cy="316.5" r="2"/>
    <circle cx="103.5" cy="316.5" r="2"/><circle cx="296.5" cy="123.5" r="2"/>
  </g>
</svg>
