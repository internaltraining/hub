<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vỏ ngoài Titanium (Nacelle Lip) -->
    <linearGradient id="pwNacelle" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D1D1D6"/>
      <stop offset="60%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Hợp kim lá cánh Titanium uốn 3D (3D Swept Blade) -->
    <linearGradient id="pwBlade" x1="180" y1="60" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="25%" stop-color="#D8D8DC"/>
      <stop offset="65%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>

    <!-- Viền phản chiếu mép lá cánh (Leading Edge) -->
    <linearGradient id="bladeHighlight" x1="165" y1="60" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E5E5EA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8E8E93" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Nón nón trung tâm (PW Conical Spinner) -->
    <radialGradient id="pwSpinner" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="55%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Ánh sáng lõi hút sâu -->
    <radialGradient id="deepIntake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </radialGradient>

    <!-- Đổ bóng 3D cánh xếp lớp -->
    <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 1 LÁ CÁNH PW1100G (Khí động học uốn cong - Swept Profile) -->
    <g id="singleBlade" filter="url(#bladeShadow)">
      <!-- Bản thân lá cánh -->
      <path d="M 194 195 
               C 186 160, 168 120, 162 76 
               C 161 70, 172 65, 182 66 
               C 198 68, 222 96, 218 135 
               C 214 165, 206 188, 206 195 Z" 
            fill="url(#pwBlade)"/>
      <!-- Mép cắt gió phản quang (Leading Edge Sheath) -->
      <path d="M 194 195 
               C 186 160, 168 120, 162 76 
               C 161 70, 168 67, 173 66
               C 178 105, 192 150, 199 195 Z" 
            fill="url(#bladeHighlight)"/>
      <!-- Gờ tán âm/cứng đầu cánh -->
      <path d="M 162 76 C 170 70, 192 68, 200 70" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" fill="none"/>
    </g>
  </defs>

  <!-- VÒNG NGOẠI VI / HUD KỸ THUẬT SIÊU MẢNH -->
  <g opacity="0.35">
    <circle cx="200" cy="200" r="186" fill="none" stroke="#8E8E93" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="200" cy="200" r="168" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- 4 vạch chuẩn cân bằng động học -->
    <line x1="200" y1="12" x2="200" y2="22" stroke="#0A84FF" stroke-width="2"/>
    <line x1="200" y1="378" x2="200" y2="388" stroke="#0A84FF" stroke-width="2"/>
    <line x1="12" y1="200" x2="22" y2="200" stroke="#0A84FF" stroke-width="2"/>
    <line x1="378" y1="200" x2="388" y2="200" stroke="#0A84FF" stroke-width="2"/>
  </g>

  <!-- LÒNG ỐNG DẪN KHÍ (INTAKE DUCT) -->
  <circle cx="200" cy="200" r="148" fill="url(#deepIntake)"/>
  
  <!-- VÀNH KEVLAR BẢO VỆ (CONTAINMENT CASING) -->
  <circle cx="200" cy="200" r="146" fill="none" stroke="#2C2C2E" stroke-width="4"/>
  <circle cx="200" cy="200" r="144" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.45"/>

  <!-- ================= 18 LÁ CÁNH PW1100G (XOAY 20 ĐỘ MỖI LÁ) ================= -->
  <g>
    <use href="#singleBlade" transform="rotate(0 200 200)"/>
    <use href="#singleBlade" transform="rotate(20 200 200)"/>
    <use href="#singleBlade" transform="rotate(40 200 200)"/>
    <use href="#singleBlade" transform="rotate(60 200 200)"/>
    <use href="#singleBlade" transform="rotate(80 200 200)"/>
    <use href="#singleBlade" transform="rotate(100 200 200)"/>
    <use href="#singleBlade" transform="rotate(120 200 200)"/>
    <use href="#singleBlade" transform="rotate(140 200 200)"/>
    <use href="#singleBlade" transform="rotate(160 200 200)"/>
    <use href="#singleBlade" transform="rotate(180 200 200)"/>
    <use href="#singleBlade" transform="rotate(200 200 200)"/>
    <use href="#singleBlade" transform="rotate(220 200 200)"/>
    <use href="#singleBlade" transform="rotate(240 200 200)"/>
    <use href="#singleBlade" transform="rotate(260 200 200)"/>
    <use href="#singleBlade" transform="rotate(280 200 200)"/>
    <use href="#singleBlade" transform="rotate(300 200 200)"/>
    <use href="#singleBlade" transform="rotate(320 200 200)"/>
    <use href="#singleBlade" transform="rotate(340 200 200)"/>
  </g>

  <!-- GỐC RỄ CHÂN CÁNH (HUB FAIRING DISC) -->
  <circle cx="200" cy="200" r="46" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>
  <circle cx="200" cy="200" r="43" fill="none" stroke="#000000" stroke-width="3" opacity="0.6"/>

  <!-- ================= CHÓP NÓN NHỌN (PW CONE SPINNER) ================= -->
  <circle cx="200" cy="200" r="36" fill="url(#pwSpinner)"/>
  <circle cx="200" cy="200" r="36" fill="none" stroke="#2C2C2E" stroke-width="1"/>

  <!-- VỆT SƠN XOẮN ĐUỔI CHIM (WHITE SPINNER SWIRL) -->
  <path d="M 200 200 
           C 204 186, 218 184, 222 174 
           C 225 166, 214 162, 206 166 
           C 194 172, 198 188, 201 198" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
  <circle cx="200" cy="200" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- MÔI VỎ ĐỘNG CƠ TITANIUM (OUTER INLET COWL LIP) -->
  <circle cx="200" cy="200" r="154" fill="none" stroke="url(#pwNacelle)" stroke-width="16"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="200" r="146" fill="none" stroke="#000000" stroke-width="2" opacity="0.7"/>

  <!-- CÁC ĐINH TÁN KHÍ ĐỘNG HỌC QUANH VÀNH (NACELLE RIVETS) -->
  <g fill="#8E8E93" opacity="0.7">
    <circle cx="200" cy="40" r="1.5"/><circle cx="200" cy="360" r="1.5"/>
    <circle cx="40" cy="200" r="1.5"/><circle cx="360" cy="200" r="1.5"/>
    <circle cx="87" cy="87" r="1.5"/><circle cx="313" cy="313" r="1.5"/>
    <circle cx="87" cy="313" r="1.5"/><circle cx="313" cy="87" r="1.5"/>
  </g>
</svg>
