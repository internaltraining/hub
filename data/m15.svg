<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vỏ ngoài Titanium (Nacelle Lip) -->
    <linearGradient id="nacelleLip" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#D1D1D6"/>
      <stop offset="70%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Màu Xanh lá ánh kim đặc trưng (Metallic Green) -->
    <linearGradient id="bladeGreen" x1="170" y1="60" x2="230" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FB884"/>
      <stop offset="35%" stop-color="#4E7A45"/>
      <stop offset="75%" stop-color="#284223"/>
      <stop offset="100%" stop-color="#142112"/>
    </linearGradient>

    <!-- Vệt sáng phản chiếu trên mép lá cánh -->
    <linearGradient id="bladeHighlight" x1="160" y1="60" x2="190" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4F0C8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8FB884" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4E7A45" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Chóp nón trung tâm (Spinner) -->
    <radialGradient id="spinnerGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="60%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Hố hút gió sâu thẳm -->
    <radialGradient id="deepHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="90%" stop-color="#0A0A0D"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </radialGradient>

    <!-- Đổ bóng 3D nổi khối cho lá cánh -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- 1 LÁ CÁNH CONG LỚN DẠNG HÌNH LIỀM (WIDE SCIMITAR BLADE) -->
    <g id="curveBlade" filter="url(#shadow)">
      <!-- Thân lá cánh chính -->
      <path d="M 194 200 
               C 188 150, 165 100, 145 65
               C 140 55, 155 48, 172 52
               C 195 58, 225 100, 215 150
               C 210 175, 204 192, 202 200 Z" 
            fill="url(#bladeGreen)"/>
      <!-- Viền sáng mép cắt gió (Leading edge) -->
      <path d="M 194 200 
               C 188 150, 165 100, 145 65
               C 140 55, 148 50, 158 51
               C 170 85, 190 140, 198 200 Z" 
            fill="url(#bladeHighlight)"/>
      <!-- Đường gân viền đỉnh cánh -->
      <path d="M 145 65 C 152 58, 168 53, 178 55" stroke="#D4F0C8" stroke-width="1" opacity="0.6" fill="none"/>
    </g>
  </defs>

  <!-- Vòng HUD kỹ thuật mờ lót nền -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="rgba(52,199,89,0.2)" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Nền hố hút gió tối màu -->
  <circle cx="200" cy="200" r="144" fill="url(#deepHole)"/>
  <circle cx="200" cy="200" r="144" fill="none" stroke="#2C2C2E" stroke-width="4"/>

  <!-- ================= ĐÚNG 12 LÁ CÁNH CONG RỘNG (XOAY ĐỀU 30 ĐỘ) ================= -->
  <g>
    <use href="#curveBlade" transform="rotate(0 200 200)"/>
    <use href="#curveBlade" transform="rotate(30 200 200)"/>
    <use href="#curveBlade" transform="rotate(60 200 200)"/>
    <use href="#curveBlade" transform="rotate(90 200 200)"/>
    <use href="#curveBlade" transform="rotate(120 200 200)"/>
    <use href="#curveBlade" transform="rotate(150 200 200)"/>
    <use href="#curveBlade" transform="rotate(180 200 200)"/>
    <use href="#curveBlade" transform="rotate(210 200 200)"/>
    <use href="#curveBlade" transform="rotate(240 200 200)"/>
    <use href="#curveBlade" transform="rotate(270 200 200)"/>
    <use href="#curveBlade" transform="rotate(300 200 200)"/>
    <use href="#curveBlade" transform="rotate(330 200 200)"/>
  </g>

  <!-- Gốc bệ đỡ trung tâm -->
  <circle cx="200" cy="200" r="42" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>
  
  <!-- Chóp nón trung tâm (Spinner) -->
  <circle cx="200" cy="200" r="32" fill="url(#spinnerGrad)"/>
  <circle cx="200" cy="200" r="32" fill="none" stroke="#48484A" stroke-width="1"/>

  <!-- Vệt xoắn trắng đặc trưng trên nón (Spinner Swirl) -->
  <path d="M 200 200 C 205 180, 222 175, 218 162 C 215 152, 202 152, 195 158 C 188 164, 192 182, 198 196" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="200" cy="200" r="3" fill="#FFFFFF"/>

  <!-- Vành môi vỏ động cơ Titanium (Nacelle Lip) -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#nacelleLip)" stroke-width="16"/>
  <circle cx="200" cy="200" r="158" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="200" cy="200" r="142" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>
</svg>
