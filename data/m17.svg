<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Kim loại Bạc Sáng cho Cánh quạt (Propeller Blade) -->
    <linearGradient id="bladeGrad" x1="180" y1="80" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E5E5EA"/>
      <stop offset="80%" stop-color="#D1D1D6"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>

    <!-- Phối màu Vỏ động cơ tuabin phía sau -->
    <radialGradient id="engineCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="75%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Phối màu Chóp nón trung tâm 3D (Spinner Hub) -->
    <radialGradient id="spinnerHub" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="60%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Hiệu ứng đổ bóng 3D cho cánh quạt -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 1 LÁ CÁNH QUẠT CHUẨN TỈ LỆ -->
    <g id="propBlade" filter="url(#dropShadow)">
      <path d="M 189 200 
               C 184 150, 172 105, 183 75 
               C 188 60, 212 60, 217 75 
               C 228 105, 216 150, 211 200 Z" 
            fill="url(#bladeGrad)"/>
      <path d="M 200 200 L 200 72" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
      <path d="M 189 200 C 184 150, 172 105, 183 75" stroke="#C7C7CC" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <!-- VÒNG TRÒN HUD MÀU XANH LÁ ĐẶC TRƯNG NHƯ CŨ -->
  <g opacity="0.65">
    <circle cx="200" cy="200" r="135" fill="none" stroke="#30D158" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(48,209,88,0.2)" stroke-width="1"/>
  </g>

  <!-- ỐNG ĐỘNG CƠ TUABIN PHÍA SAU -->
  <circle cx="200" cy="200" r="115" fill="url(#engineCore)"/>
  <circle cx="200" cy="200" r="115" fill="none" stroke="#3A3A3C" stroke-width="3"/>
  <circle cx="200" cy="200" r="112" fill="none" stroke="#30D158" stroke-width="1" opacity="0.4"/>

  <!-- ================= ĐÚNG 5 LÁ CÁNH QUẠT (XOAY ĐỀU 72 ĐỘ) ================= -->
  <g>
    <use href="#propBlade" transform="rotate(0 200 200)"/>
    <use href="#propBlade" transform="rotate(72 200 200)"/>
    <use href="#propBlade" transform="rotate(144 200 200)"/>
    <use href="#propBlade" transform="rotate(216 200 200)"/>
    <use href="#propBlade" transform="rotate(288 200 200)"/>
  </g>

  <!-- BỆ ĐỠ TRUNG TÂM -->
  <circle cx="200" cy="200" r="40" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>

  <!-- CHÓP NÓN TRUNG TÂM (SPINNER HUB) -->
  <circle cx="200" cy="200" r="30" fill="url(#spinnerHub)"/>
  <circle cx="200" cy="200" r="30" fill="none" stroke="#48484A" stroke-width="1"/>

  <!-- VỆT XOẮN TRẮNG TRÊN NÓN (SPINNER SWIRL) -->
  <path d="M 200 200 C 203 185, 218 182, 215 170 C 212 161, 201 161, 196 166 C 190 172, 193 185, 198 196" 
        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="200" cy="200" r="2.5" fill="#FFFFFF"/>
</svg>
