<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Cánh quạt Titanium (Sáng kim loại sang trọng) -->
    <linearGradient id="titaniumBlade" x1="0" y1="45" x2="0" y2="200">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Phối màu Vỏ động cơ phía sau (Nacelle Intake) -->
    <linearGradient id="cowlGrad" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Khối cầu 3D cho Chóp nón (Spinner) -->
    <radialGradient id="spinner3D" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D1D1D6"/>
      <stop offset="30%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Màu Xanh Cyan phát sáng (Hiệu ứng vòng xoay HUD) -->
    <linearGradient id="neonCyan" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Hiệu ứng tỏa sáng mờ -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="bladeShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Định nghĩa 1 Lá cánh quạt lớn (Propeller Blade) - Đã căn chuẩn tâm 200 -->
    <path id="propBlade" d="M 190 200 C 150 145, 160 70, 192 45 C 198 37, 208 37, 214 45 C 240 70, 230 145, 210 200 Z" 
          fill="url(#titaniumBlade)" stroke="#3A3A3C" stroke-width="1.5" filter="url(#bladeShadow)"/>
  </defs>

  <!-- ================= VỎ ĐỘNG CƠ & CỬA NẠP (ĐẶT Ở TÂM CHUẨN 200, 200) ================= -->
  <!-- Vành ngoài cùng của vỏ động cơ (Nacelle) -->
  <circle cx="200" cy="200" r="130" fill="url(#cowlGrad)" stroke="#636366" stroke-width="2"/>
  
  <!-- Lỗ hút gió (Air Intake) màu đen sâu thẳm -->
  <circle cx="200" cy="200" r="105" fill="#0A0A0A" stroke="#1C1C1E" stroke-width="4"/>
  <circle cx="200" cy="200" r="105" fill="none" stroke="#000000" stroke-width="8" opacity="0.6"/>

  <!-- ================= VÒNG QUAY KHÍ ĐỘNG HỌC (HUD RINGS) ================= -->
  <g filter="url(#glow)">
    <circle cx="200" cy="200" r="165" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 16" opacity="0.7"/>
    <circle cx="200" cy="200" r="165" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="100 200" stroke-linecap="round"/>
  </g>

  <!-- ================= HỆ THỐNG 4 CÁNH QUẠT LỚN (PROPELLERS) ================= -->
  <g>
    <use href="#propBlade" transform="rotate(0 200 200)"/>
    <use href="#propBlade" transform="rotate(90 200 200)"/>
    <use href="#propBlade" transform="rotate(180 200 200)"/>
    <use href="#propBlade" transform="rotate(270 200 200)"/>
  </g>

  <!-- ================= CHÓP NÓN (SPINNER) ================= -->
  <circle cx="200" cy="200" r="48" fill="url(#spinner3D)"/>
  <circle cx="200" cy="200" r="48" fill="none" stroke="#636366" stroke-width="1.5"/>

  <!-- Đường gân xoắn ốc (Swirl Line) sơn trắng trên chóp nón -->
  <path d="M 200 200 Q 235 160, 222 154" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Lỗ ốc vít lục giác ở đỉnh chóp -->
  <circle cx="200" cy="200" r="4" fill="#1C1C1E"/>

  <!-- ================= LABELS KỸ THUẬT (HUD OVERLAY) ================= -->
  <g opacity="0.8">
    <line x1="30" y1="200" x2="60" y2="200" stroke="#4FACFE" stroke-width="2"/>
    <line x1="340" y1="200" x2="370" y2="200" stroke="#4FACFE" stroke-width="2"/>
    <text x="50" y="55" fill="#4FACFE" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" filter="url(#glow)">TURBOPROP</text>
    <text x="50" y="70" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VARIABLE PITCH</text>
  </g>
</svg>
