<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Cánh quạt Titanium (Sáng kim loại sang trọng) -->
    <linearGradient id="titaniumBlade" x1="0" y1="40" x2="0" y2="220">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Phối màu Vỏ động cơ phía sau (Nacelle Intake) -->
    <linearGradient id="cowlGrad" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Khối cầu 3D cho Chóp nón (Spinner) -->
    <radialGradient id="spinner3D" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D1D1D6"/>
      <stop offset="30%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Màu Xanh Cyan phát sáng (Hiệu ứng vòng xoay HUD) -->
    <linearGradient id="neonCyan" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Hiệu ứng tỏa sáng mờ -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Định nghĩa 1 Lá cánh quạt lớn (Propeller Blade) -->
    <!-- Dáng cánh xòe rộng ở giữa, thuôn tròn ở đỉnh và hẹp ở gốc (Root) -->
    <path id="propBlade" d="M 190 220 C 150 160, 160 80, 192 40 C 198 32, 208 32, 214 40 C 240 80, 230 160, 210 220 Z" 
          fill="url(#titaniumBlade)" stroke="#3A3A3C" stroke-width="1.5"/>
  </defs>

  <!-- ================= VỎ ĐỘNG CƠ & CỬA NẠP (PHÍA SAU) ================= -->
  <!-- Vành ngoài cùng của vỏ động cơ (Nacelle) -->
  <circle cx="200" cy="220" r="130" fill="url(#cowlGrad)" stroke="#636366" stroke-width="2"/>
  
  <!-- Lỗ hút gió (Air Intake) màu đen sâu thẳm -->
  <circle cx="200" cy="220" r="105" fill="#0A0A0A" stroke="#1C1C1E" stroke-width="4"/>
  <circle cx="200" cy="220" r="105" fill="none" stroke="#000000" stroke-width="8" opacity="0.6"/>

  <!-- ================= VÒNG QUAY KHÍ ĐỘNG HỌC (HUD RINGS) ================= -->
  <!-- Quỹ đạo đầu cánh (Tip Path Plane) phát sáng -->
  <g filter="url(#glow)">
    <circle cx="200" cy="220" r="165" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 16" opacity="0.7"/>
    <circle cx="200" cy="220" r="165" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="100 200" stroke-linecap="round"/>
  </g>

  <!-- ================= HỆ THỐNG 4 CÁNH QUẠT LỚN (PROPELLERS) ================= -->
  <!-- Xoay đều 4 góc 90 độ, đổ bóng nhẹ để nổi khối -->
  <g>
    <!-- Đổ bóng (Drop shadow) cho toàn bộ cụm cánh -->
    <g opacity="0.4" transform="translate(4, 6)">
      <use href="#propBlade" fill="#000" transform="rotate(0 200 220)"/>
      <use href="#propBlade" fill="#000" transform="rotate(90 200 220)"/>
      <use href="#propBlade" fill="#000" transform="rotate(180 200 220)"/>
      <use href="#propBlade" fill="#000" transform="rotate(270 200 220)"/>
    </g>
    
    <!-- Cánh quạt chính -->
    <use href="#propBlade" transform="rotate(0 200 220)"/>
    <use href="#propBlade" transform="rotate(90 200 220)"/>
    <use href="#propBlade" transform="rotate(180 200 220)"/>
    <use href="#propBlade" transform="rotate(270 200 220)"/>
  </g>

  <!-- ================= CHÓP NÓN (SPINNER) ================= -->
  <!-- Chóp nón trung tâm siêu to đặc trưng của Propeller -->
  <circle cx="200" cy="220" r="48" fill="url(#spinner3D)"/>
  <circle cx="200" cy="220" r="48" fill="none" stroke="#636366" stroke-width="1.5"/>

  <!-- Đường gân xoắn ốc (Swirl Line) sơn trắng trên chóp nón -->
  <path d="M 200 220 Q 235 180, 222 174" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Lỗ ốc vít lục giác ở đỉnh chóp -->
  <circle cx="200" cy="220" r="4" fill="#1C1C1E"/>

  <!-- ================= LABELS KỸ THUẬT (HUD OVERLAY) ================= -->
  <g opacity="0.8">
    <line x1="30" y1="220" x2="60" y2="220" stroke="#4FACFE" stroke-width="2"/>
    <line x1="340" y1="220" x2="370" y2="220" stroke="#4FACFE" stroke-width="2"/>
    <text x="50" y="60" fill="#4FACFE" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" filter="url(#glow)">TURBOPROP</text>
    <text x="50" y="75" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VARIABLE PITCH</text>
  </g>
</svg>
