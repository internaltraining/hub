<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Kim loại Bạc Sáng cho Cánh quạt (Propeller Blade) -->
    <linearGradient id="bladeGrad" x1="180" y1="80" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E5E5EA"/>
      <stop offset="80%" stop-color="#D1D1D6"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>

    <!-- Phối màu Vỏ động cơ tuabin phía sau (Turboprop Cowling) -->
    <radialGradient id="engineCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="75%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Phối màu Chóp nón trung tâm 3D (Spinner Hub) -->
    <radialGradient id="spinnerHub" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="60%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Hiệu ứng đổ bóng 3D cho cánh quạt -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- 1 LÁ CÁNH QUẠT CHUẨN TỈ LỆ (Hướng thẳng lên trên, tâm quay ở 200,200) -->
    <g id="propBlade" filter="url(#dropShadow)">
      <!-- Thân lá cánh bầu bĩnh, gọn gàng, không bị dài quá cỡ -->
      <path d="M 188 200 
               C 182 150, 172 105, 184 72 
               C 190 55, 210 55, 216 72 
               C 228 105, 218 150, 212 200 Z" 
            fill="url(#bladeGrad)"/>
      <!-- Đường gân phản quang sống lưng cánh -->
      <path d="M 200 200 L 200 70" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
      <!-- Viền cạnh sắc nét -->
      <path d="M 188 200 C 182 150, 172 105, 184 72" stroke="#C7C7CC" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <!-- VÒNG TRÒN HUD KỸ THUẬT MỜ LÓT NỀN -->
  <g opacity="0.35">
    <circle cx="200" cy="200" r="130" fill="none" stroke="#0A84FF" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="200" cy="200" r="148" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- ỐNG ĐỘNG CƠ TURBOPROP PHÍA SAU -->
  <circle cx="200" cy="200" r="110" fill="url(#engineCore)"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#3A3A3C" stroke-width="3"/>

  <!-- ================= 4 LÁ CÁNH QUẠT (XOAY ĐỀU 90 ĐỘ) ================= -->
  <g>
    <!-- Cánh trên -->
    <use href="#propBlade" transform="rotate(0 200 200)"/>
    <!-- Cánh phải -->
    <use href="#propBlade" transform="rotate(90 200 200)"/>
    <!-- Cánh dưới (Đã được thu ngắn, nằm gọn trong vòng 400px tuyệt đối) -->
    <use href="#propBlade" transform="rotate(180 200 200)"/>
    <!-- Cánh trái -->
    <use href="#propBlade" transform="rotate(270 200 200)"/>
  </g>

  <!-- BỆ ĐỠ TRUNG TÂM -->
  <circle cx="200" cy="200" r="40" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>

  <!-- CHÓP NÓN TRUNG TÂM (SPINNER HUB) -->
  <circle cx="200" cy="200" r="30" fill="url(#spinnerHub)"/>
  <circle cx="200" cy="200" r="30" fill="none" stroke="#48484A" stroke-width="1"/>

  <!-- VỆT XOẮN TRẮNG ĐẶC TRƯNG TRÊN NÓN (SPINNER SWIRL) -->
  <path d="M 200 200 C 203 185, 218 182, 215 170 C 212 161, 201 161, 196 166 C 190 172, 193 185, 198 196" 
        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="200" cy="200" r="2.5" fill="#FFFFFF"/>
</svg>
