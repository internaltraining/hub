<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Cánh máy bay (Hợp kim Titanium) -->
    <linearGradient id="metalWing" x1="0" y1="100" x2="400" y2="300">
      <stop offset="0%" stop-color="#E5E5EA"/>
      <stop offset="40%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    
    <!-- Luồng gió phía trên (Vận tốc cao, áp suất thấp - Xanh Cyan) -->
    <linearGradient id="aeroFast" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Luồng gió phía dưới (Vận tốc thấp, áp suất cao - Xanh Lá) -->
    <linearGradient id="aeroSlow" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0%" stop-color="#00F260"/>
      <stop offset="100%" stop-color="#0575E6"/>
    </linearGradient>

    <!-- Màu mũi tên Lực Nâng (Lift Force - Đỏ Cam) -->
    <linearGradient id="liftForce" x1="0" y1="200" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF2A54"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Hiệu ứng tỏa sáng Neon cho hầm gió -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- MÀN HÌNH HUD / HỆ TRỤC ĐO LƯỜNG TỌA ĐỘ -->
  <!-- Vòng tròn Radar ngắm -->
  <circle cx="200" cy="220" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="200" cy="220" r="80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Trục tọa độ X-Y (Đo góc tấn) -->
  <line x1="40" y1="220" x2="360" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- TOÀN BỘ KHỐI KHÍ ĐỘNG HỌC (Xoay nghiêng 15 độ để tạo Angle of Attack) -->
  <g transform="rotate(-15 200 220)">
    
    <!-- LUỒNG GIÓ DƯỚI (High Pressure Flow) -->
    <path d="M 10 260 C 60 260, 100 270, 180 270 C 260 270, 320 260, 390 260" 
          stroke="url(#aeroSlow)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M 20 280 C 80 280, 150 285, 200 285 C 280 285, 330 280, 380 280" 
          stroke="rgba(0, 242, 96, 0.4)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- MẶT CẮT CÁNH MÁY BAY (Airfoil Shape) -->
    <!-- Đường cong của cánh: Dày ở mũi, bo cong phía trên, vát nhọn ở đuôi -->
    <path d="M 60 220 C 60 160, 160 170, 340 220 C 180 240, 80 245, 60 220 Z" 
          fill="url(#metalWing)" stroke="#D1D1D6" stroke-width="2"/>
    
    <!-- Điểm trọng tâm / Tâm áp suất khí động (Center of Pressure) -->
    <circle cx="160" cy="205" r="6" fill="#1C1C1E"/>
    <circle cx="160" cy="205" r="2" fill="url(#liftForce)" filter="url(#glow)"/>

    <!-- LUỒNG GIÓ TRÊN (Low Pressure / High Speed Flow) -->
    <!-- Gió tách ra ở mũi cánh và bẻ cong lên trên tạo lực nâng -->
    <path d="M 10 220 C 30 220, 50 145, 160 145 C 260 145, 320 205, 390 210" 
          stroke="url(#aeroFast)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glowStrong)"/>
    <path d="M 20 190 C 40 190, 70 120, 170 120 C 250 120, 300 180, 380 190" 
          stroke="rgba(0, 242, 254, 0.5)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 30 160 C 60 160, 90 95, 180 95 C 240 95, 280 155, 370 170" 
          stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- ĐIỂM CHẠM MŨI CÁNH (Stagnation Point) -->
    <circle cx="58" cy="220" r="4" fill="#00F2FE" filter="url(#glow)"/>

  </g>

  <!-- MŨI TÊN LỰC NĂNG (LIFT VECTOR) -->
  <!-- Mũi tên luôn hướng thẳng góc lên trên trời, vuông góc với luồng gió -->
  <g filter="url(#glow)">
    <line x1="180" y1="200" x2="180" y2="80" stroke="url(#liftForce)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,65 165,90 195,90" fill="#FF9500"/>
  </g>
  <!-- Nhãn công thức "L" (Lift) -->
  <text x="195" y="100" fill="#FF9500" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" font-style="italic" filter="url(#glow)">L</text>
  
</svg>
