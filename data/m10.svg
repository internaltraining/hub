<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Background Tech Grid & World Map Lines -->
  <g opacity="0.15" stroke="#3b82f6" stroke-width="1">
    <circle cx="400" cy="250" r="220" fill="none" stroke-dasharray="4,8"/>
    <circle cx="400" cy="250" r="160" fill="none"/>
    <line x1="100" y1="250" x2="700" y2="250" stroke-dasharray="5,5"/>
    <line x1="400" y1="50" x2="400" y2="450" stroke-dasharray="5,5"/>
  </g>

  <!-- Connecting Lines Network -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.6" fill="none">
    <path d="M400,130 L240,270 L400,380 L560,270 Z" />
    <line x1="400" y1="130" x2="400" y2="380" stroke-dasharray="4,4"/>
    <line x1="240" y1="270" x2="560" y2="270" stroke-dasharray="4,4"/>
  </g>

  <!-- Glowing Nodes at Junctions -->
  <circle cx="400" cy="130" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="240" cy="270" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="560" cy="270" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="400" cy="380" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="400" cy="250" r="6" fill="#93c5fd" filter="url(#glow)"/>

  <!-- ==================== 1. ICAO (Top) ==================== -->
  <g transform="translate(400, 130)" filter="url(#shadow)">
    <polygon points="0,-75 75,0 0,75 -75,0" fill="url(#diamondGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
    <polygon points="0,-67 67,0 0,67 -67,0" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">ICAO</text>
    <text x="0" y="16" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">GLOBAL</text>
  </g>

  <!-- ==================== 2. FAA (Left) ==================== -->
  <g transform="translate(240, 270)" filter="url(#shadow)">
    <polygon points="0,-75 75,0 0,75 -75,0" fill="url(#diamondGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
    <polygon points="0,-67 67,0 0,67 -67,0" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">FAA</text>
    <text x="0" y="16" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">USA</text>
  </g>

  <!-- ==================== 3. CAAV (Right) ==================== -->
  <g transform="translate(560, 270)" filter="url(#shadow)">
    <polygon points="0,-75 75,0 0,75 -75,0" fill="url(#diamondGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
    <polygon points="0,-67 67,0 0,67 -67,0" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">CAAV</text>
    <text x="0" y="16" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VIETNAM</text>
  </g>

  <!-- ==================== 4. EASA (Bottom) ==================== -->
  <g transform="translate(400, 380)" filter="url(#shadow)">
    <polygon points="0,-75 75,0 0,75 -75,0" fill="url(#diamondGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
    <polygon points="0,-67 67,0 0,67 -67,0" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2">EASA</text>
    <text x="0" y="16" text-anchor="middle" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">EUROPE</text>
  </g>

</svg>
