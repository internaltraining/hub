<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Phối màu Bo mạch (Đen xám) -->
    <linearGradient id="chip" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <!-- Màu phát sáng Tím Magenta (Advanced Tech) -->
    <linearGradient id="neonPurple" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <!-- Màu phát sáng Xanh Cyan -->
    <linearGradient id="neonCyan" x1="0" y1="400" x2="400" y2="0">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Vòng Radar / Diagnostic Diagnostics (Chạy quanh chip) -->
  <circle cx="200" cy="220" r="140" fill="none" stroke="#2C2C2E" stroke-width="4"/>
  <circle cx="200" cy="220" r="140" fill="none" stroke="url(#neonPurple)" stroke-width="8" stroke-dasharray="300 600" stroke-linecap="round" filter="url(#glowStrong)" transform="rotate(45 200 220)"/>
  <circle cx="200" cy="220" r="100" fill="none" stroke="#2C2C2E" stroke-width="3" stroke-dasharray="10 12"/>

  <!-- Các đường mạch điện tử (PCB Traces) -->
  <g stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowStrong)">
    <path d="M 200 150 V 90 L 160 50"/>
    <path d="M 250 220 H 310 L 350 180"/>
    <path d="M 150 220 H 90 L 50 260"/>
    <path d="M 200 290 V 350 L 240 390"/>
    <!-- Nút giao điểm (Data nodes) -->
    <circle cx="160" cy="50" r="8" fill="#fff"/>
    <circle cx="350" cy="180" r="8" fill="#fff"/>
    <circle cx="50" cy="260" r="8" fill="#fff"/>
    <circle cx="240" cy="390" r="8" fill="#fff"/>
  </g>

  <!-- Khung vi mạch trung tâm (Main CPU / Avionics Box) -->
  <rect x="140" y="160" width="120" height="120" rx="24" fill="url(#chip)" stroke="url(#neonPurple)" stroke-width="4"/>
  
  <!-- Lõi xử lý dữ liệu bên trong vi mạch -->
  <rect x="160" y="180" width="80" height="80" rx="12" fill="#1C1C1E" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Các luồng dữ liệu (Data lines) bên trong chip -->
  <path d="M 175 200 H 225 M 175 220 H 225 M 175 240 H 225" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" filter="url(#glowStrong)"/>
  
  <!-- Chân kim loại của chip -->
  <path d="M 160 150 V 160 M 200 150 V 160 M 240 150 V 160 M 160 280 V 290 M 200 280 V 290 M 240 280 V 290" stroke="#8E8E93" stroke-width="6" stroke-linecap="round"/>
  <path d="M 130 180 H 140 M 130 220 H 140 M 130 260 H 140 M 260 180 H 270 M 260 220 H 270 M 260 260 H 270" stroke="#8E8E93" stroke-width="6" stroke-linecap="round"/>
</svg>
